{% extends "base.html" %}

{% block title %}
Edit Ingredient | Meal Planner
{% endblock %}

{% block content %}

<h1>Edit Ingredient</h1>

<div class="card">

    <form method="POST">

        <div class="form-group">

            <label>Product</label>

            <select name="product_id" required>

                {% for product in products %}

                <option value="{{ product.product_id }}" {% if product.product_id==ingredient.product_id %} selected {%
                    endif %}>
                    {{ product.product_name }}
                    ({{ product.product_unit }})
                </option>

                {% endfor %}

            </select>

        </div>

        <br>

        <div class="form-group">

            <label>Quantity</label>

            <input type="number" step="0.01" min="0.01" name="quantity" value="{{ ingredient.ingredient_quantity }}"
                required>

        </div>

        <br>

        <div class="actions">

            <button type="submit">
                Save changes
            </button>

            <a class="button button-secondary" href="{{ url_for(
                    'recipes.recipe_ingredients',
                    recipe_id=recipe.recipe_id
                ) }}">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
