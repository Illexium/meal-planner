<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}Meal Planner{% endblock %}
    </title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="header">

        <div class="container header-inner">

            <a href="/" class="logo">
                Meal Planner
            </a>

            <nav class="nav">

                <a href="{{ url_for('products.product_list') }}">
                    Products
                </a>

                <a href="{{ url_for('inventory.inventory_list') }}">
                    Inventory
                </a>

                <a href="{{ url_for('recipes.recipe_list') }}">
                    Recipes
                </a>

                <a href="{{ url_for('meal_plans.meal_plan_list') }}">
                    Meal Plans
                </a>

                <a href="{{ url_for(
                    'shopping_lists.shopping_list_list'
                ) }}">
                    Shopping Lists
                </a>

            </nav>

        </div>

    </header>

    <main class="container page">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
