{% extends "base.html" %}

{% block title %}
Edit Meal Plan | Meal Planner
{% endblock %}

{% block content %}

<h1>Edit Meal Plan</h1>

<div class="card">

    <form method="POST">

        <div class="form-group">

            <label>Start date</label>

            <input type="date" name="start_date" value="{{ meal_plan.start_date }}" required>

        </div>

        <br>

        <div class="form-group">

            <label>End date</label>

            <input type="date" name="end_date" value="{{ meal_plan.end_date }}" required>

        </div>

        <br>

        <div class="actions">

            <button type="submit">
                Save changes
            </button>

            <a class="button button-secondary" href="{{ url_for('meal_plans.meal_plan_list') }}">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
