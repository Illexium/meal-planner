<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
</head>

<body>

    <h1>Edit Product</h1>

    <form method="POST">

        <label>Name:</label>
        <input type="text" name="name" value="{{ product.product_name }}" required>

        <br><br>

        <label>Category:</label>
        <input type="text" name="category" value="{{ product.product_category }}" required>

        <br><br>

        <label>Unit:</label>
        <input type="text" name="unit" value="{{ product.product_unit }}" required>

        <br><br>

        <button type="submit">
            Save changes
        </button>

        <a href="{{ url_for('products.product_list') }}">
            Cancel
        </a>

    </form>

</body>

</html>
