{% extends "base.html" %}

{% block title %}
Edit Product | Meal Planner
{% endblock %}

{% block content %}

<h1>Edit Product</h1>

<div class="card">

    <form method="POST">

        <div class="form-group">

            <label>Name</label>

            <input type="text" name="name" value="{{ product.product_name }}" required>

        </div>

        <br>

        <div class="form-group">

            <label>Category</label>

            <input type="text" name="category" value="{{ product.product_category }}" required>

        </div>

        <br>

        <div class="form-group">

            <label>Unit</label>

            <input type="text" name="unit" value="{{ product.product_unit }}" required>

        </div>

        <br>

        <div class="actions">

            <button type="submit">
                Save changes
            </button>

            <a class="button button-secondary" href="{{ url_for('products.product_list') }}">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
