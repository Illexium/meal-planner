{% extends "base.html" %}

{% block title %}
Edit Recipe | Meal Planner
{% endblock %}

{% block content %}

<h1>Edit Recipe</h1>

<div class="card">

    <form method="POST">

        <div class="form-group">

            <label>Recipe name</label>

            <input type="text" name="name" value="{{ recipe.recipe_name }}" required>

        </div>

        <br>

        <div class="form-group">

            <label>Description</label>

            <textarea name="description">{{ recipe.recipe_descr }}</textarea>

        </div>

        <br>

        <div class="form-group">

            <label>Servings</label>

            <input type="number" name="servings" min="1" value="{{ recipe.servings }}" required>

        </div>

        <br>

        <div class="actions">

            <button type="submit">
                Save changes
            </button>

            <a class="button button-secondary" href="{{ url_for('recipes.recipe_list') }}">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
