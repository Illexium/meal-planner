<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Recipe</title>
</head>

<body>

    <h1>Edit Recipe</h1>

    <form method="POST">

        <label>Name:</label>

        <input type="text" name="name" value="{{ recipe.recipe_name }}" required>

        <br><br>

        <label>Description:</label>

        <input type="text" name="description" value="{{ recipe.recipe_descr }}">

        <br><br>

        <label>Servings:</label>

        <input type="number" name="servings" min="1" value="{{ recipe.servings }}" required>

        <br><br>

        <button type="submit">
            Save changes
        </button>

        <a href="{{ url_for('recipes.recipe_list') }}">
            Cancel
        </a>

    </form>

</body>

</html>
